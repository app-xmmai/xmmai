<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SpikeDash</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a2a8a;user-select:none;-webkit-user-select:none;font-family:"Arial Black",Impact,"Trebuchet MS",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.gd{color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;pointer-events:none;z-index:5}
.scr.on{display:flex}
.scr button,.scr input,.scr .card{pointer-events:auto}
.title{font-size:min(15vw,17vh);letter-spacing:.5vh;line-height:1}
.row{display:flex;align-items:center;justify-content:center;gap:4vw}
button{font-family:inherit;cursor:pointer;color:#fff;border:.5vh solid #000;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;transition:transform .08s}
button:hover{transform:scale(1.07)}button:active{transform:scale(.95)}
.pb{width:min(22vw,26vh);height:min(22vw,26vh);border-radius:2.4vh;background:linear-gradient(#9dff4a,#27b800);font-size:min(12vw,14vh);line-height:1;box-shadow:inset 0 -1.2vh 0 rgba(0,0,0,.25),inset 0 .8vh 0 rgba(255,255,255,.45)}
.ib{width:min(15vw,18vh);height:min(15vw,18vh);border-radius:2vh;font-size:min(3.2vw,3.6vh);padding:.5vh;box-shadow:inset 0 -1vh 0 rgba(0,0,0,.25),inset 0 .7vh 0 rgba(255,255,255,.45)}
.blue{background:linear-gradient(#5cd7ff,#0a7fe0)}.orange{background:linear-gradient(#ffd24a,#ff7a00)}.red{background:linear-gradient(#ff7a7a,#d01818)}.green{background:linear-gradient(#9dff4a,#27b800)}
.sm{padding:1.2vh 2.4vw;border-radius:1.6vh;font-size:min(2.4vw,3vh);box-shadow:inset 0 -.8vh 0 rgba(0,0,0,.25),inset 0 .5vh 0 rgba(255,255,255,.4)}
#coinbox{position:fixed;top:2vh;right:2vw;font-size:min(3vw,4vh);z-index:6;display:none}
#coinbox.on{display:block}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(#fff6a8,#ffc800 60%,#c48a00);border:.12em solid #000;vertical-align:-.15em;margin-left:.2em}
.card{width:min(80vw,900px);padding:3vh 3vw;border-radius:2.4vh;border:.6vh solid #000;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.5)),var(--cc,#2a6);text-align:center;cursor:pointer;box-shadow:0 1vh 0 rgba(0,0,0,.4)}
.card h2{font-size:min(7vw,9vh)}
.bar{height:min(3vh,26px);background:rgba(0,0,0,.6);border:.4vh solid #000;border-radius:2vh;overflow:hidden;margin:1vh auto;width:80%}
.bar i{display:block;height:100%;background:linear-gradient(#b8ff5a,#2fb800)}
.lab{font-size:min(2.6vw,3vh)}
input[type=number]{width:9vw;min-width:90px;font:inherit;font-size:min(2.6vw,3vh);text-align:center;border:.4vh solid #000;border-radius:1vh;padding:.6vh}
#shopgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6vh 1.2vw;width:min(92vw,1100px);max-height:62vh;overflow:auto;padding:1vh;pointer-events:auto}
.sk{background:rgba(0,0,0,.45);border:.4vh solid #000;border-radius:1.6vh;padding:.8vh;text-align:center;cursor:pointer;color:#fff;font-size:min(1.8vw,2.2vh)}
.sk.sel{background:rgba(120,255,60,.5)}.sk canvas{position:static;width:min(7vw,9vh);height:min(7vw,9vh)}
#edbar{position:fixed;left:0;right:0;bottom:0;display:none;gap:.6vh 1vw;flex-wrap:wrap;z-index:7;align-items:center;justify-content:center;padding:1vh 1vw;background:linear-gradient(rgba(5,15,60,.88),rgba(0,0,30,.96));border-top:.5vh solid #000;max-height:26vh;overflow-y:auto}
#edbar.on{display:flex}
#edbar button{padding:.7vh 1vw;font-size:min(1.6vw,2.2vh);border-radius:1.2vh;box-shadow:inset 0 -.5vh 0 rgba(0,0,0,.25),inset 0 .3vh 0 rgba(255,255,255,.4)}
#edbar button.act{outline:.5vh solid #fff;transform:scale(1.1)}
.eg{display:flex;gap:.5vw;flex-wrap:wrap;align-items:center;padding:.4vh .6vw;border-radius:1.4vh;background:rgba(255,255,255,.1)}
.egl{font-size:min(1.3vw,1.8vh);opacity:.8;color:#fff;margin-right:.3vw}
.ov{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(0,0,30,.7)}
.ov.on{display:flex}
.ov input[type=text]{width:min(70vw,520px);font:inherit;font-size:min(3vw,3.6vh);text-align:center;border:.5vh solid #000;border-radius:1.4vh;padding:1vh}
#svlist{display:flex;flex-direction:column;gap:1.2vh;width:min(90vw,800px);max-height:62vh;overflow:auto;pointer-events:auto;padding:1vh}
.sv{display:flex;align-items:center;gap:1.2vw;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.45)),#1a7bd8;border:.5vh solid #000;border-radius:1.8vh;padding:1.2vh 1.4vw;box-shadow:0 .8vh 0 rgba(0,0,0,.35)}
.sv .nm{flex:1;text-align:left;font-size:min(3vw,3.6vh)}
.sv .ct{font-size:min(1.8vw,2.2vh)}
.toast{position:fixed;top:3vh;left:50%;transform:translateX(-50%);z-index:12;padding:1vh 2vw;border-radius:1.4vh;background:#27b800;border:.4vh solid #000;font-size:min(2.4vw,3vh);display:none}
.title{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1vh) scale(1.03)}}@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes rainbow{to{filter:hue-rotate(360deg)}}@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}@keyframes glow{50%{box-shadow:0 0 2.5vh .6vh rgba(255,255,255,.55)}}.scr.on{animation:popin .35s ease-out}#win .title{animation:bob .9s ease-in-out infinite;background:linear-gradient(90deg,#ff3b6b,#ffd400,#3aff7a,#38d0ff,#b45cff,#ff3b6b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:.6vh #000;paint-order:stroke fill;animation:bob .9s ease-in-out infinite,rainbow 2.5s linear infinite}.scr button{animation:glow 2s ease-in-out infinite}#win button{animation:wiggle .8s ease-in-out infinite,glow 1.5s ease-in-out infinite}
.pb{box-shadow:0 0 3vh rgba(157,255,74,.7),inset 0 -1.2vh 0 rgba(0,0,0,.25),inset 0 .8vh 0 rgba(255,255,255,.45)}
@media(max-width:700px){#shopgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="coinbox" class="gd"><span id="cn">0</span><span class="coin"></span></div>

<div id="splash" class="scr"><div class="gd" style="font-size:min(8vw,10vh)">XMMAI</div><div class="gd" style="font-size:min(4vw,5vh)">Corporation</div></div>
<div id="load" class="scr"><div class="gd title">SpikeDash</div><div class="bar" style="width:min(60vw,700px)"><i id="lb" style="width:0%"></i></div><div class="gd lab" id="lt">Loading...</div></div>
<div id="menu" class="scr">
  <div class="gd title">SpikeDash</div>
  <div class="row">
    <button class="ib blue" id="bShop">SHOP</button>
    <button class="pb" id="bPlay">&#9654;</button>
    <button class="ib orange" id="bCreate">CREATE</button>
  </div>
  <div class="row"><button class="sm red" id="bSaved">Saved</button><button class="sm blue" id="bFs">Fullscreen</button></div>
</div>
<div id="sel" class="scr">
  <div class="row" style="width:100%;justify-content:space-around">
    <button class="ib green" id="pv" style="width:min(10vw,12vh);height:min(10vw,12vh);font-size:min(6vw,7vh)">&#9664;</button>
    <div class="card" id="card"><h2 class="gd" id="sn">Level 1</h2><div class="gd lab" id="sd">Easy</div><div class="bar"><i id="sb" style="width:0%"></i></div><div class="gd lab" id="sc">0%</div><div class="gd lab" id="sco"></div></div>
    <button class="ib green" id="nx" style="width:min(10vw,12vh);height:min(10vw,12vh);font-size:min(6vw,7vh)">&#9654;</button>
  </div>
  <div class="row"><button class="sm blue" id="m10">-10</button><input type="number" id="go" min="1" max="612" value="1"><button class="sm blue" id="p10">+10</button><button class="sm orange" id="bGo">Go</button></div>
  <button class="sm red" id="selBack">Back</button>
</div>
<div id="shop" class="scr">
  <div class="gd" style="font-size:min(6vw,8vh)">Icon shop</div>
  <div id="shopgrid"></div>
  <button class="sm red" id="shBack">Back</button>
</div>
<div id="win" class="scr">
  <div class="gd title" style="font-size:min(9vw,11vh)">Level complete!</div>
  <div class="gd lab" id="ws" style="font-size:min(3.4vw,4.4vh)"></div>
  <div class="row"><button class="sm green" id="wN">Next</button><button class="sm orange" id="wR">Retry</button><button class="sm red" id="wM">Menu</button></div>
</div>
<div id="edbar">
 <div class="eg"><span class="egl gd">BUILD</span><button class="blue" data-t="0">&#9650; Spike</button><button class="blue" data-t="15">&#9652; Mini spike</button><button class="blue" data-t="1">&#9632; Block</button><button class="green" data-t="8">&#9644; Block row</button><button class="orange" id="eRow">Row x8: OFF</button><button class="blue" data-t="2">&#9679; Coin</button></div>
 <div class="eg"><span class="egl gd">HAZARD</span><button class="orange" data-t="9">&#10040; Saw</button><button class="orange" data-t="10">&#10040; Big saw</button><button class="red" data-t="11">&#9881; Chainsaw</button></div>
 <div class="eg"><span class="egl gd">BOOST</span><button class="orange" data-t="5">&#11014; Pad</button><button class="orange" data-t="14">&#9678; Orb</button><button class="blue" data-t="12">&#8645; Flip</button><button class="green" data-t="13">&#8645; Normal</button></div>
 <div class="eg"><span class="egl gd">TELEPORT</span><button class="red" data-t="6">&#9654; TP Start</button><button class="blue" data-t="7">&#9724; TP End</button><button class="red" data-t="16">&#9654; TP Start row</button><button class="blue" data-t="17">&#9724; TP End row</button></div>
 <div class="eg"><span class="egl gd">TOOLS</span><button class="orange" data-t="3">&#10021; Move</button><button class="red" data-t="4">&#9003; Erase</button><button class="blue" id="eU">&#8630; Undo</button><button class="blue" id="eL">&#9664;</button><button class="blue" id="eR">&#9654;</button></div>
 <div class="eg"><button class="green" id="eP">&#9654; Test</button><button class="green" id="eS">&#128190; Save</button><button class="red" id="eC">Clear</button><button class="red" id="eX">Exit</button></div>
 <span class="gd" id="ei" style="font-size:min(1.6vw,2.2vh)"></span>
</div>
<div id="saved" class="scr"><div class="gd" style="font-size:min(6vw,8vh)">Saved levels</div><div id="svlist"></div><button class="sm red" id="svBack">Back</button></div>
<div id="nm" class="ov"><div class="gd" style="font-size:min(5vw,6vh)">Name your level</div><input type="text" id="nmin" maxlength="24" placeholder="My level"><div class="row"><button class="sm green" id="nmOk">Save</button><button class="sm red" id="nmCancel">Cancel</button></div></div>
<div id="toast" class="toast gd"></div>
<button class="sm orange" id="bBoost" tabindex="-1" style="position:fixed;right:2vw;bottom:3vh;z-index:6;display:none">BOOST (B)</button>

<script>
(function(){
"use strict";
var U=48,GROUND=560,SPEED=430,GRAV=3100,JUMP=830,CEIL=560-9*48;
var $=function(i){return document.getElementById(i)};
var cv=$("c"),g=cv.getContext("2d"),K=1,WW=1280,mx=0,my=0;

/* ---------- save ---------- */
var KEY="spikedash_v2";
var save=(function(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.own)return s}catch(e){}return{coins:0,own:[0],skin:0,best:{},lc:{},custom:[],levels:[]}})();
function put(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

if(!save.levels)save.levels=[];if(save.custom&&save.custom.length){save.levels.push({name:"My level",obs:save.custom});save.custom=[];put()}
/* ---------- skins (cube icons with different faces) ---------- */
var SK=[
 {c:"#7dff3a",d:"#2a8a00",f:0,p:0},{c:"#ffd400",d:"#a56a00",f:1,p:40},{c:"#ff3b6b",d:"#8a0030",f:2,p:80},
 {c:"#35b6ff",d:"#0a3d9a",f:3,p:120},{c:"#b45cff",d:"#4a1a8a",f:4,p:160},{c:"#ff8a1f",d:"#8a3a00",f:5,p:200},
 {c:"#ff7ad9",d:"#9a2078",f:6,p:260},{c:"#ffffff",d:"#8899aa",f:7,p:320},{c:"#2cf0b0",d:"#066a55",f:8,p:400},
 {c:"#6b7488",d:"#14171f",f:9,p:480},{c:"#ff4040",d:"#7a0a0a",f:10,p:560},{c:"#ffe14a",d:"#e0402a",f:11,p:650},
 {c:"#4dd2ff",d:"#0a5a8a",f:0,p:700,h:1},{c:"#ff9d2e",d:"#8a3a00",f:3,p:800,h:2},{c:"#c77dff",d:"#4a1a8a",f:1,p:900,h:3},{c:"#3aff7a",d:"#0a6a30",f:4,p:1000,h:4},
 {c:"#ffd400",d:"#a56a00",f:8,p:1100,h:6},{c:"#ff5d8f",d:"#8a1040",f:6,p:1200,h:5},{c:"#9aa7ff",d:"#2a2a8a",f:9,p:1300,h:7},{c:"#ffffff",d:"#667788",f:2,p:1500,h:6}
];
function drawCube(c,id,t){
  var s=SK[id];
  c.save();c.lineJoin="round";c.lineCap="round";
  var h=s.h|0,R0=U/2;
  function shp(r){c.beginPath();var i,a,q,n;
    if(h===0)c.rect(-r,-r,2*r,2*r);
    else if(h===1)c.arc(0,0,r*1.04,0,6.283);
    else if(h===2){c.moveTo(0,-r*1.2);c.lineTo(r*1.15,r*.9);c.lineTo(-r*1.15,r*.9);c.closePath()}
    else if(h===3){c.moveTo(0,-r*1.25);c.lineTo(r*1.25,0);c.lineTo(0,r*1.25);c.lineTo(-r*1.25,0);c.closePath()}
    else if(h===6){for(i=0;i<10;i++){a=i*.6283-1.5708;q=i%2?r*.62:r*1.3;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath()}
    else{n=h===4?6:h===5?5:8;for(i=0;i<n;i++){a=i*6.283/n-1.5708+(n===8?.3927:0);c.lineTo(Math.cos(a)*r*1.1,Math.sin(a)*r*1.1)}c.closePath()}}
  c.shadowColor="rgba(0,0,0,.35)";c.shadowBlur=8;c.shadowOffsetY=3;
  c.fillStyle="#000";shp(R0+2);c.fill();c.shadowColor="transparent";
  c.fillStyle=s.c;shp(R0);c.fill();c.fillStyle=s.d;shp(R0-4);c.fill();c.fillStyle=s.c;shp(R0-7);c.fill();
  if(h){c.scale(.82,.82);if(h===2)c.translate(0,7)}
  c.strokeStyle="#000";c.fillStyle="#000";c.lineWidth=3;
  var f=s.f;
  function dot(x,y,r){c.beginPath();c.arc(x,y,r,0,6.283);c.fill()}
  function arc(x,y,r,a,b){c.beginPath();c.arc(x,y,r,a,b);c.stroke()}
  function ln(a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
  if(f===0){dot(-8,-3,4);c.beginPath();c.moveTo(3,-1);c.quadraticCurveTo(8,-8,13,-1);c.stroke();arc(0,4,8,.2,2.9)}
  else if(f===1){arc(-8,0,5,3.4,6.0);arc(8,0,5,3.4,6.0);arc(0,5,8,.2,2.9)}
  else if(f===2){c.fillRect(-15,-8,30,9);c.fillStyle="#fff";c.fillRect(-12,-6,5,2);c.fillRect(3,-6,5,2);c.fillStyle="#000";arc(0,8,6,.3,2.8)}
  else if(f===3){ln(-14,-12,-3,-6);ln(14,-12,3,-6);dot(-8,-1,3.5);dot(8,-1,3.5);arc(0,12,7,3.5,5.9)}
  else if(f===4){dot(-8,-4,4.5);dot(8,-4,4.5);c.beginPath();c.arc(0,9,4,0,6.283);c.stroke()}
  else if(f===5){c.fillStyle="#2cf";c.fillRect(-16,-9,32,12);c.strokeRect(-16,-9,32,12);c.fillStyle="#000";dot(-7,-3,3);dot(7,-3,3);ln(-8,10,8,10)}
  else if(f===6){ln(-13,-2,-4,-2);ln(4,-2,13,-2);c.beginPath();c.ellipse(0,9,3,4,0,0,6.283);c.stroke()}
  else if(f===7){c.beginPath();c.moveTo(-20,-18);c.lineTo(-10,-24);c.lineTo(-6,-14);c.fill();c.beginPath();c.moveTo(20,-18);c.lineTo(10,-24);c.lineTo(6,-14);c.fill();dot(-8,-3,3.5);dot(8,-3,3.5);arc(-3,4,3,0,3.14);arc(3,4,3,0,3.14);ln(-22,2,-13,3);ln(22,2,13,3)}
  else if(f===8){c.font="bold 16px Arial";c.textAlign="center";c.fillText("\u2605",-8,3);c.fillText("\u2605",9,3);arc(0,6,8,.2,2.9)}
  else if(f===9){dot(-8,-3,5);dot(8,-3,5);c.beginPath();c.moveTo(0,3);c.lineTo(-3,9);c.lineTo(3,9);c.fill();ln(-9,13,9,13);ln(-3,11,-3,15);ln(3,11,3,15)}
  else if(f===10){c.fillStyle="#e00";c.font="bold 17px Arial";c.textAlign="center";c.fillText("\u2665",-8,3);c.fillText("\u2665",9,3);c.fillStyle="#000";arc(0,6,8,.2,2.9)}
  else if(f===11){dot(-8,-5,3.5);dot(8,-5,3.5);c.beginPath();c.arc(0,3,9,0,3.14);c.fill();c.fillStyle="#ff5d8f";c.beginPath();c.arc(3,10,4,0,3.14);c.fill()}
  c.restore();
}

/* ---------- levels (612 generated + custom) ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var NAMES=["Neon","Pulse","Stereo","Rush","Cobalt","Blaze","Echo","Drift","Zenith","Orbit","Prism","Turbo","Glitch","Volt","Nova","Comet"];
var NAMES2=["Dash","Run","Jump","Rift","Wave","Storm","Grid","Beat","Surge","Trail","Peak","Flip"];
function lname(n){var r=rng(n*31+7);return NAMES[Math.floor(r()*NAMES.length)]+" "+NAMES2[Math.floor(r()*NAMES2.length)]}
function diff(n){var d=(n-1)/611;return d<.1?"Easy":d<.25?"Normal":d<.45?"Hard":d<.65?"Harder":d<.85?"Insane":"Demon"}
function hue(n){return(n*47)%360}
function gen(n){
  var r=rng(n*7919+13),d=Math.min(1,(n-1)/611),len=8100+Math.floor(Math.min(n,400)*.45),obs=[],pos=[],col=14,i;
  var maxT=3+Math.floor(d*5);
  var pid=0,flipped=false,zEnd=0;
  while(col<len){
    if(flipped&&col>=zEnd){obs.push({k:9,x:col+3,y:0});flipped=false;col+=12;continue}
    if(!flipped&&col<len*.38&&r()<.025){obs.push({k:8,x:col+3,y:0});flipped=true;zEnd=Math.min(col+40+Math.floor(r()*60),len*.43);col+=12;continue}
    if(!flipped&&r()<.03){var skip=30+Math.floor(r()*60);obs.push({k:5,x:col+3,y:0,pid:pid},{k:4,x:col+3+skip,y:0,pid:pid});pid++;col+=skip+12;len+=skip+12;continue}
    if(!flipped&&col<len*.5&&r()<.09){var rowH=3+Math.floor(r()*4);
      obs.push({k:3,x:col+2,y:0});
      for(i=0;i<6;i++){obs.push({k:0,x:col+8+i*5,y:0},{k:0,x:col+9+i*5,y:0},{k:0,x:col+10+i*5,y:0})}
      for(i=0;i<29;i++)obs.push({k:1,x:col+8+i,y:rowH});
      col+=46;continue}
    if(r()<.07){for(i=0;i<7;i++)obs.push({k:1,x:col+4+i,y:1});obs.push({k:0,x:col+5,y:0},{k:0,x:col+7,y:0});col+=20;continue}
    if(r()<.1){var sz=(d>.15&&r()<.4)?2:1,mv=(d>.1&&r()<.35);obs.push({k:mv?7:6,x:col+3,y:(sz-1)/2,s:sz});col+=11;continue}
    var k=Math.floor(r()*maxT),x=col,w=1,L;
    if(k===0){obs.push({k:0,x:x,y:0})}
    else if(k===1){obs.push({k:0,x:x,y:0},{k:0,x:x+1,y:0});w=2}

  else if(k==="KeyF")toggleFs();
  else if(k==="Escape"){
    if(state==="play"||state==="dead"||state==="winning"||state==="win"){if(testing){testing=false;startEdit(true)}else if(cur==="my"){go("saved","saved");buildSaved()}else{go("sel","sel");updSel()}}
    else if(state==="sel"||state==="shop")go("menu","menu")}
  else if(state==="sel"){if(k==="ArrowRight"){sel++;updSel()}else if(k==="ArrowLeft"){sel--;updSel()}else if(k==="Enter")start(sel)}
});
window.addEventListener("keyup",function(e){if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")held=false});
window.addEventListener("blur",function(){held=false});
$("bBoost").onclick=function(){boost();this.blur()};
window.addEventListener("pointerdown",function(e){if(state==="play"&&e.target.tagName!=="BUTTON"){held=true;jbuf=.1}});
window.addEventListener("pointerup",function(){held=false});

/* ---------- fullscreen fit + loop ---------- */
function fit(){var d=Math.min(window.devicePixelRatio||1,3);cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d)}
window.addEventListener("resize",fit);fit();
var last=0,acc=0,STEP=1/60;
function frame(ts){
  if(!last)last=ts;var dt=(ts-last)/1000;last=ts;if(dt>.1)dt=.1;acc+=dt;
  while(acc>=STEP){if(state==="play"||state==="dead"||state==="winning")update(STEP);else if(state==="win"){update(STEP)}acc-=STEP}
  render();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
